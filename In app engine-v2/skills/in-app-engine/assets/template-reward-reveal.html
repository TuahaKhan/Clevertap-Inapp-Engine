<!--
  CleverTap Custom HTML In-App — WEIGHTED REWARD TEMPLATE
  --------------------------------------------------------
  Pattern: pick one of N items with different probabilities and reveal it as a
  rarity-tiered card. Useful for pack openings, mystery boxes, gacha campaigns,
  variant A/B reveals.

  To customize:
  - Edit the `players` array (rename to fit your domain): name, rarity, weight, stats.
  - Edit the .rarity-* CSS classes to change tier visuals.
  - Edit event names in handleCTA() and the impression block at the bottom.

  Dashboard checklist:
  - Template: Custom HTML
  - "Enable JavaScript": CHECKED
  - "Enable click tracking for Custom HTML": UNCHECKED (this template fires clicks manually)
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player Pack Reveal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Oswald', sans-serif;
    background: transparent !important;
  }

  .overlay {
    position: fixed;
    inset: 0;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999999;
    animation: fadeIn 0.4s ease-out;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .close-btn {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.4);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    transition: transform 0.2s;
  }
  .close-btn:hover { transform: scale(1.1); background: rgba(0,0,0,0.7); }

  .card-stage {
    perspective: 1200px;
    width: 300px;
    height: 440px;
    position: relative;
  }

  .card {
    width: 100%;
    height: 100%;
    border-radius: 20px;
    position: relative;
    overflow: hidden;
    transform: scale(0.3) rotateY(180deg);
    opacity: 0;
    animation: cardReveal 1.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }

  @keyframes cardReveal {
    0%   { transform: scale(0.3) rotateY(180deg); opacity: 0; }
    50%  { transform: scale(1.05) rotateY(90deg); opacity: 1; }
    100% { transform: scale(1) rotateY(0deg); opacity: 1; }
  }

  /* Common — Bronze */
  .rarity-common {
    background:
      linear-gradient(135deg, #6b4423 0%, #a87141 35%, #d4a373 50%, #a87141 65%, #6b4423 100%);
    border: 3px solid #c89968;
  }
  /* Rare — Silver */
  .rarity-rare {
    background:
      linear-gradient(135deg, #4a5568 0%, #8a96a8 35%, #d8dee9 50%, #8a96a8 65%, #4a5568 100%);
    border: 3px solid #c0c8d4;
  }
  /* Epic — Gold */
  .rarity-epic {
    background:
      linear-gradient(135deg, #8b6914 0%, #d4a017 30%, #fcd34d 50%, #d4a017 70%, #8b6914 100%);
    border: 3px solid #fde68a;
  }
  /* Legendary — Iridescent */
  .rarity-legendary {
    background:
      linear-gradient(135deg, #ff006e 0%, #fb5607 20%, #ffbe0b 40%, #8338ec 60%, #3a86ff 80%, #ff006e 100%);
    background-size: 300% 300%;
    border: 3px solid #fff;
    animation: cardReveal 1.4s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s forwards,
               iridescent 4s ease infinite 1.7s;
  }

  @keyframes iridescent {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  .shine {
    position: absolute;
    inset: 0;
    background: linear-gradient(115deg,
      transparent 30%,
      rgba(255,255,255,0.4) 45%,
      rgba(255,255,255,0.6) 50%,
      rgba(255,255,255,0.4) 55%,
      transparent 70%);
    transform: translateX(-100%);
    animation: shineSweep 2.5s ease-in-out 1.6s infinite;
    pointer-events: none;
  }

  @keyframes shineSweep {
    0%   { transform: translateX(-100%); }
    60%  { transform: translateX(100%); }
    100% { transform: translateX(100%); }
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 20px;
    display: flex;
    flex-direction: column;
    color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .rating {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    line-height: 0.9;
    letter-spacing: -2px;
  }

  .position {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    margin-top: 4px;
    opacity: 0.95;
  }

  .rarity-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    padding: 6px 12px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 4px;
    backdrop-filter: blur(4px);
  }

  .player-visual {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 10px 0;
    position: relative;
  }

  .jersey-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 180px;
    line-height: 1;
    opacity: 0.18;
    color: #fff;
    position: absolute;
    text-shadow: none;
    letter-spacing: -8px;
  }

  .flag {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(180deg, #74acdf 0%, #74acdf 33%, #fff 33%, #fff 66%, #74acdf 66%);
    border: 4px solid rgba(255,255,255,0.85);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
  }

  .flag::after {
    content: '☀';
    color: #f4c430;
    text-shadow: 0 0 4px rgba(0,0,0,0.3);
  }

  .card-bottom {
    text-align: center;
    border-top: 1px solid rgba(255,255,255,0.3);
    padding-top: 14px;
  }

  .player-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 1px;
    line-height: 1;
  }

  .player-team {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 6px;
    opacity: 0.9;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin-top: 12px;
  }

  .stat {
    text-align: center;
  }

  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 20px;
    line-height: 1;
  }

  .stat-label {
    font-size: 9px;
    letter-spacing: 1.5px;
    opacity: 0.8;
    margin-top: 2px;
  }

  .cta {
    margin-top: 28px;
    padding: 14px 36px;
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    background: #fff;
    color: #000;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    opacity: 0;
    animation: fadeUp 0.5s ease-out 1.8s forwards;
    transition: transform 0.2s;
  }
  .cta:hover { transform: translateY(-2px); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .stage-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Sparkles for legendary */
  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 10px #fff, 0 0 20px #ffbe0b;
    animation: twinkle 1.8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0); }
    50%      { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<div class="overlay" id="overlay">
  <button class="close-btn" onclick="dismissCampaign()">✕</button>

  <div class="stage-wrap">
    <div class="card-stage">
      <div class="card" id="card">
        <div class="shine"></div>
        <div class="card-inner">

          <div class="card-top">
            <div>
              <div class="rating" id="rating">--</div>
              <div class="position" id="position">--</div>
            </div>
            <div class="rarity-badge" id="rarityBadge">--</div>
          </div>

          <div class="player-visual">
            <div class="jersey-num" id="jerseyNum">10</div>
            <div class="flag"></div>
          </div>

          <div class="card-bottom">
            <div class="player-name" id="playerName">--</div>
            <div class="player-team" id="playerTeam">--</div>
            <div class="stats">
              <div class="stat"><div class="stat-val" id="s1">--</div><div class="stat-label">PAC</div></div>
              <div class="stat"><div class="stat-val" id="s2">--</div><div class="stat-label">SHO</div></div>
              <div class="stat"><div class="stat-val" id="s3">--</div><div class="stat-label">DRI</div></div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <button class="cta" onclick="handleCTA()">Claim Player</button>
  </div>
</div>

<script>
  // === WEIGHTED PLAYER POOL ===
  const players = [
    {
      name: 'Julián Álvarez',
      rarity: 'COMMON',
      rarityClass: 'rarity-common',
      weight: 80,
      position: 'ST',
      team: 'Atlético Madrid',
      rating: 86,
      jersey: '19',
      stats: { PAC: 84, SHO: 85, DRI: 84 }
    },
    {
      name: 'Rodrigo De Paul',
      rarity: 'RARE',
      rarityClass: 'rarity-rare',
      weight: 5,
      position: 'CM',
      team: 'Inter Miami',
      rating: 84,
      jersey: '7',
      stats: { PAC: 75, SHO: 76, DRI: 83 }
    },
    {
      name: 'Emiliano Martínez',
      rarity: 'EPIC',
      rarityClass: 'rarity-epic',
      weight: 5,
      position: 'GK',
      team: 'Aston Villa',
      rating: 87,
      jersey: '23',
      stats: { DIV: 86, REF: 89, HAN: 84 }
    },
    {
      name: 'Lionel Messi',
      rarity: 'LEGENDARY',
      rarityClass: 'rarity-legendary',
      weight: 1,
      position: 'RW',
      team: 'Inter Miami',
      rating: 93,
      jersey: '10',
      stats: { PAC: 85, SHO: 92, DRI: 95 }
    }
  ];

  // Sum-of-weights = 91. Remaining 9% absorbed by Julián (Common).
  // To match the spec exactly (80/5/5/1 = 91), we pick on weight-sum 91.
  function pickPlayer() {
    const total = players.reduce((s, p) => s + p.weight, 0);
    let r = Math.random() * total;
    for (const p of players) {
      if (r < p.weight) return p;
      r -= p.weight;
    }
    return players[0];
  }

  const chosen = pickPlayer();

  // Render
  const card = document.getElementById('card');
  card.classList.add(chosen.rarityClass);

  document.getElementById('rating').textContent = chosen.rating;
  document.getElementById('position').textContent = chosen.position;
  document.getElementById('rarityBadge').textContent = chosen.rarity;
  document.getElementById('jerseyNum').textContent = chosen.jersey;
  document.getElementById('playerName').textContent = chosen.name.toUpperCase();
  document.getElementById('playerTeam').textContent = chosen.team;

  const statKeys = Object.keys(chosen.stats);
  document.getElementById('s1').textContent = chosen.stats[statKeys[0]];
  document.getElementById('s2').textContent = chosen.stats[statKeys[1]];
  document.getElementById('s3').textContent = chosen.stats[statKeys[2]];

  // Update stat labels for goalkeepers
  const labels = card.querySelectorAll('.stat-label');
  labels[0].textContent = statKeys[0];
  labels[1].textContent = statKeys[1];
  labels[2].textContent = statKeys[2];

  // Sparkles for Legendary
  if (chosen.rarity === 'LEGENDARY') {
    const stage = document.querySelector('.card-stage');
    for (let i = 0; i < 12; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 2 + 1.8) + 's';
      stage.appendChild(s);
    }
  }

  // === CleverTap UNIVERSAL DISMISS (with old-SDK fallback) ===
  function dismissCampaign() {
    var modernPathCalled = false;

    // iOS
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.clevertap) {
        window.webkit.messageHandlers.clevertap.postMessage({ action: 'dismissInAppNotification' });
        modernPathCalled = true;
      }
    } catch (e) {}

    // Android (modern SDK)
    try {
      if (window.CleverTap && typeof window.CleverTap.dismissInAppNotification === 'function') {
        window.CleverTap.dismissInAppNotification();
        modernPathCalled = true;
      }
    } catch (e) {}


    // Visual hide as immediate feedback
    var ov = document.getElementById('overlay');
    if (ov) ov.style.display = 'none';

    // Legacy Android fallback — only fires if no modern path matched
    // (e.g. older Android SDK without dismissInAppNotification). The SDK
    // intercepts wzrk:// navigations and dismisses the in-app as a side effect.
    if (!modernPathCalled) {
      setTimeout(function() {
        try { window.location.href = 'wzrk://dismiss'; } catch (e) {}
      }, 100);
    }
  }

  // === In-App event tracker (Android + iOS + fallback) ===
  function trackEvent(name, props) {
    // Android
    try {
      if (window.CleverTap && typeof window.CleverTap.pushEvent === 'function') {
        window.CleverTap.pushEvent(name, JSON.stringify(props || {}));
        return;
      }
    } catch (e) {}
    // iOS
    try {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.clevertap) {
        window.webkit.messageHandlers.clevertap.postMessage({
          action: 'recordEventWithProps', event: name, properties: props || {}
        });
        return;
      }
    } catch (e) {}
    // Web Pop-up
    try {
      if (typeof clevertap !== 'undefined' && clevertap.event) {
        clevertap.event.push(name, props || {});
      }
    } catch (e) {}
  }

  function handleCTA() {
    trackEvent('Player Pack Opened', {
      'Player Name': chosen.name,
      'Rarity': chosen.rarity,
      'Rating': chosen.rating
    });
    dismissCampaign();
  }

  // Impression event
  trackEvent('Player Pack Revealed', {
    'Player Name': chosen.name,
    'Rarity': chosen.rarity
  });
</script>

</body>
</html>
